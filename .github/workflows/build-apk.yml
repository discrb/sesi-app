name: Build SESI Portal APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q -o SESI-Portal-Android.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Set Android SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > sesi_android/local.properties

      - name: Build debug APK
        working-directory: sesi_android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SESI-Portal-APK
          path: sesi_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
